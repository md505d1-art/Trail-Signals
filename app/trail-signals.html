<title>Trail Signals</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Find outdoor spots near you and get there by bus, train, tram or ferry.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen phone app. Scrolling view, optional action bar, tab bar. The radar puts you in the middle: rings are travel minutes, pins sit in their real compass direction. */
:root{
  --bg:#FAF5E8; --surface:#FFFDF8; --sunk:#EFE8D6; --line:#E6DDC8; --line-strong:#D3C9B0;
  --ink:#1B241E; --ink-2:#3A463E; --muted:#56635A; --faint:#8A9389;
  --forest:#2E5B3B; --forest-deep:#1F4029; --leaf:#5E9A5F; --on-forest:#FFFFFF; --select:#F1F6EC;
  --sky:#2C6E95; --link:#2A6890;
  --good-bg:#E2EDDD; --good-fg:#1F4029;
  --warn-bg:#FCEBCB; --warn-fg:#6B4400; --amber:#C7791A; --amber-bg:#FFF3E2;
  --info-bg:#DDEBF3; --info-fg:#163F57;
  --bus:#2C6E95; --train:#1F4029; --tram:#6A4C93; --ferry:#0F6E73; --on-mode:#FFFFFF; --live:#3F8A52;
  --radar-bg:#EEF2E2; --radar-ring:#C9D6BC; --radar-text:#4C5B50;
  --summary-bg:#1F4029; --summary-fg:#FFFFFF; --summary-muted:#CFE0CB;
  --display:"Bricolage Grotesque",Figtree,system-ui,sans-serif;
  --body:Figtree,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101712; --surface:#18211B; --sunk:#222D25; --line:#2B372F; --line-strong:#3B4A40;
  --ink:#EEF0E6; --ink-2:#CDD5CB; --muted:#A5B0A6; --faint:#7E897F;
  --forest:#8CC79A; --forest-deep:#B7DEBB; --leaf:#5E9A5F; --on-forest:#0E1911; --select:#1D2B21;
  --sky:#8EC3E3; --link:#8EC3E3;
  --good-bg:#1E3324; --good-fg:#B7DEBB;
  --warn-bg:#3A2D12; --warn-fg:#F2C46B; --amber:#E9A24B; --amber-bg:#33270F;
  --info-bg:#17303F; --info-fg:#BFE0F2;
  --bus:#2C6E95; --train:#2E5B3B; --tram:#6A4C93; --ferry:#0F6E73; --on-mode:#FFFFFF; --live:#6CC383;
  --radar-bg:#162019; --radar-ring:#2D3D31; --radar-text:#9FB0A3;
  --summary-bg:#1E3324; --summary-fg:#EEF0E6; --summary-muted:#A9C4AC;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101712; --surface:#18211B; --sunk:#222D25; --line:#2B372F; --line-strong:#3B4A40;
  --ink:#EEF0E6; --ink-2:#CDD5CB; --muted:#A5B0A6; --faint:#7E897F;
  --forest:#8CC79A; --forest-deep:#B7DEBB; --leaf:#5E9A5F; --on-forest:#0E1911; --select:#1D2B21;
  --sky:#8EC3E3; --link:#8EC3E3;
  --good-bg:#1E3324; --good-fg:#B7DEBB;
  --warn-bg:#3A2D12; --warn-fg:#F2C46B; --amber:#E9A24B; --amber-bg:#33270F;
  --info-bg:#17303F; --info-fg:#BFE0F2;
  --bus:#2C6E95; --train:#2E5B3B; --tram:#6A4C93; --ferry:#0F6E73; --on-mode:#FFFFFF; --live:#6CC383;
  --radar-bg:#162019; --radar-ring:#2D3D31; --radar-text:#9FB0A3;
  --summary-bg:#1E3324; --summary-fg:#EEF0E6; --summary-muted:#A9C4AC;
  color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-tap-highlight-color:transparent;overflow:hidden}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--link)}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.row{display:flex;align-items:center}
.stack{display:flex;flex-direction:column}
.muted{color:var(--muted)}
.num{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}

#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;background:var(--bg);position:relative}
#main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border-top:1.5px solid var(--line);padding-block:6px 8px;flex-shrink:0}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;color:var(--muted);font-size:12px;font-weight:600;text-decoration:none}
.tab[aria-current="page"]{color:var(--forest);font-weight:700}
.actionbar{display:flex;gap:10px;background:var(--surface);border-top:1.5px solid var(--line);padding-block:10px;flex-shrink:0}

/* brand header */
.brand{gap:10px}
.wordmark{font-family:var(--display);font-weight:800;font-size:24px;line-height:1;color:var(--forest-deep);letter-spacing:-.01em}
.tagline{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:3px}
.locpill{margin-left:auto;max-width:46%;min-height:44px;display:inline-flex;align-items:center;gap:6px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line-strong);background:var(--surface);font-size:13px;font-weight:700;cursor:pointer;color:var(--ink)}
.locpill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search{height:46px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line-strong);display:flex;align-items:center;gap:10px;padding:0 6px 0 14px;color:var(--muted)}
.search input{border:0;outline:none;background:transparent;font-weight:500;flex:1;min-width:0;color:var(--ink)}
.search button{height:36px;border:0;border-radius:10px;background:var(--forest);color:var(--on-forest);font-weight:700;padding:0 12px;cursor:pointer}
input::placeholder,textarea::placeholder{color:var(--muted)}

/* chips & buttons */
.chip{height:44px;min-width:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line-strong);background:var(--surface);color:var(--ink);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;flex-shrink:0;text-decoration:none}
.chip[aria-pressed="true"]{background:var(--forest);border-color:var(--forest);color:var(--on-forest)}
.chip.soft{background:var(--good-bg);border-color:transparent;color:var(--good-fg)}
.scroll-x{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-block:2px}
.scroll-x::-webkit-scrollbar{display:none}
.iconbtn{width:44px;height:44px;flex-shrink:0;border-radius:14px;border:1.5px solid var(--line-strong);background:var(--surface);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none}
.btn{min-height:52px;border-radius:16px;border:0;background:var(--forest);color:var(--on-forest);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;padding:0 18px;text-decoration:none;text-align:center}
.btn.ghost{background:var(--surface);color:var(--forest-deep);border:1.5px solid var(--forest)}
.btn.quiet{background:var(--sunk);color:var(--ink)}
.btn:disabled{background:var(--sunk);color:var(--muted);cursor:not-allowed}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:18px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap}
.good{background:var(--good-bg);color:var(--good-fg)}
.warn{background:var(--warn-bg);color:var(--warn-fg)}
.info{background:var(--info-bg);color:var(--info-fg)}
.plain{background:var(--sunk);color:var(--ink)}
.label{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.mode{display:inline-flex;align-items:center;gap:4px;padding:3px 7px;border-radius:7px;font-size:12px;font-weight:700;color:var(--on-mode);white-space:nowrap}
.mode.bus{background:var(--bus)}.mode.train,.mode.metro{background:var(--train)}.mode.tram{background:var(--tram)}.mode.ferry{background:var(--ferry)}
.mode.walk{background:var(--sunk);color:var(--ink)}.mode.change{background:var(--info-bg);color:var(--info-fg)}
.note{display:flex;gap:10px;padding:12px 14px;border-radius:14px;font-size:13px;line-height:1.45}
.note>svg{flex-shrink:0;margin-top:1px}
.bars{display:inline-flex;gap:2px;align-items:flex-end}
.bars i{width:4px;border-radius:1px;background:currentColor}
.bars i:nth-child(1){height:6px}.bars i:nth-child(2){height:10px}.bars i:nth-child(3){height:14px}
.bars i.off{opacity:.28}
.est{font-size:12px;font-weight:700;color:var(--muted)}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--forest-deep)}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--live)}

/* daylight */
.daylight{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2)}
.daybar{flex:1;height:6px;border-radius:999px;background:var(--sunk);overflow:hidden;min-width:60px}
.daybar i{display:block;height:100%;background:linear-gradient(90deg,#E9B44C,#E07B39);border-radius:999px}

/* radar */
.radarwrap{position:relative;border-radius:22px;background:var(--radar-bg);border:1.5px solid var(--line-strong);overflow:hidden}
.radar{position:relative;width:100%;max-width:420px;margin:0 auto;aspect-ratio:1/1}
.radar>svg{position:absolute;inset:0;width:100%;height:100%}
.sweep{position:absolute;inset:6%;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 290deg,color-mix(in srgb,var(--forest) 30%,transparent) 360deg);animation:spin 2.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.you{position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--sky);border:3px solid var(--surface);box-shadow:0 0 0 6px color-mix(in srgb,var(--sky) 22%,transparent)}
.pin{position:absolute;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;border:2.5px solid var(--surface);background:var(--forest);color:var(--on-forest);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.pin.k-view,.pin.k-peak{background:#3D6E8F}.pin.k-water,.pin.k-beach,.pin.k-falls{background:#0F6E73}.pin.k-picnic{background:#8A5A1E}
.pin[aria-pressed="true"]{width:44px;height:44px;z-index:3;outline:3px solid var(--amber);outline-offset:1px}
.pin .lbl{position:absolute;top:100%;margin-top:6px;left:50%;transform:translateX(-50%);background:var(--forest-deep);color:var(--bg);font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap;pointer-events:none;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.pin.sig-good::after,.pin.sig-warn::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:2.5px solid var(--live);animation:ping 2.2s ease-out infinite}
.pin.sig-warn::after{border-color:var(--amber)}
@keyframes ping{0%{transform:scale(.8);opacity:1}100%{transform:scale(1.6);opacity:0}}
.radarlegend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11.5px;font-weight:600;color:var(--radar-text);padding:0 12px 10px}
.radarlegend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.surprise{position:absolute;right:10px;top:10px;z-index:4;min-height:40px;border-radius:999px;border:0;background:var(--surface);color:var(--forest-deep);font-weight:700;font-size:13px;padding:0 12px;display:flex;align-items:center;gap:6px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.15)}

/* spot cards */
.sel{display:flex;flex-direction:column;overflow:hidden}
.selmain{display:flex;gap:12px;padding:12px;text-decoration:none;color:inherit}
.thumb{width:92px;height:92px;border-radius:14px;overflow:hidden;flex-shrink:0;background:var(--sunk)}
.thumb svg{display:block;width:100%;height:100%}
.selfoot{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1.5px solid var(--line);margin:0 12px;padding-block:10px;gap:10px}
.selfoot div{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);line-height:1.25}
.selfoot b{display:block;color:var(--ink);font-size:15px}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rowcard{display:flex;gap:12px;padding:10px;text-decoration:none;color:inherit;align-items:center}
.rowcard .thumb{width:60px;height:60px;border-radius:12px}

/* details */
.hero{position:relative;height:260px;background:var(--sunk)}
.hero svg.art{display:block;width:100%;height:100%}
.hero .iconbtn{position:absolute;top:12px;border:0;background:var(--surface)}
.cap{position:absolute;bottom:12px;background:rgba(17,24,19,.78);color:#fff;font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px}
.stats{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:15px;font-weight:600}
.stats>span{display:inline-flex;align-items:center;gap:6px}
.banner{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--warn-bg);color:var(--warn-fg);text-decoration:none;font-size:14px}
.banner.good{background:var(--good-bg);color:var(--good-fg)}
.transrow{display:flex;gap:12px;align-items:center;padding:12px 14px;text-decoration:none;color:inherit;cursor:pointer;width:100%;text-align:left}
.transrow+.transrow{border-top:1.5px solid var(--line)}
.ricon{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff}
.vote{height:38px;min-width:44px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line-strong);background:var(--surface);font-weight:600;font-size:13px;cursor:pointer}
.vote[aria-pressed="true"]{background:var(--good-bg);border-color:var(--forest);color:var(--good-fg)}

/* trip */
.summary{background:var(--summary-bg);color:var(--summary-fg);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.timeline{list-style:none;margin:0;padding:0}
.step{display:grid;grid-template-columns:66px 22px minmax(0,1fr);column-gap:6px}
.step .t{font-weight:700;font-size:13px;white-space:nowrap;text-align:right;padding-top:1px;font-variant-numeric:tabular-nums}
.rail{display:flex;flex-direction:column;align-items:center}
.rail .dot{width:16px;height:16px;border-radius:50%;border:3.5px solid var(--muted);background:var(--surface);margin-top:2px;flex-shrink:0}
.rail .line{flex:1;width:0;border-left:5px solid transparent;margin-top:2px;min-height:12px}
.step.walk .line{border-left-style:dotted;border-color:var(--faint)}
.step.bus .line,.step.bus .dot{border-color:var(--bus)}
.step.train .line,.step.train .dot,.step.metro .line,.step.metro .dot{border-color:var(--train)}
.step.tram .line,.step.tram .dot{border-color:var(--tram)}
.step.ferry .line,.step.ferry .dot{border-color:var(--ferry)}
.step.change .line{border-left-style:dotted;border-color:var(--line-strong)}.step.change .dot{border-color:var(--sky)}
.step.arrive .dot{border-color:var(--forest);background:var(--forest)}
.step .body{padding-bottom:20px;display:flex;flex-direction:column;gap:6px;min-width:0}
.dirs{list-style:none;margin:0;padding:12px 14px 14px;display:flex;flex-direction:column;gap:12px;font-size:14px}
.dirs li{display:flex;gap:10px}
.dirs .n{width:24px;height:24px;border-radius:50%;background:var(--good-bg);color:var(--good-fg);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.switch{width:52px;height:32px;border-radius:999px;border:0;background:var(--line-strong);position:relative;cursor:pointer;flex-shrink:0}
.switch[aria-pressed="true"]{background:var(--forest)}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.switch[aria-pressed="true"]::after{left:24px}

/* update form */
.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cat{min-height:56px;padding:8px 12px;text-align:left;cursor:pointer;display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface)}
.cat .ci{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cat[aria-pressed="true"]{border:2px solid var(--amber);padding:7.5px 11.5px;background:var(--amber-bg)}
.cat.g[aria-pressed="true"]{border-color:var(--forest);background:var(--good-bg)}
textarea{width:100%;border-radius:14px;border:1.5px solid var(--line-strong);background:var(--surface);padding:12px 14px;font-size:15px;resize:none}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{padding:0;margin-bottom:10px;font-weight:700;font-size:16px}
.photobox{min-height:88px;border-radius:16px;border:1.5px dashed var(--line-strong);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;cursor:pointer;color:var(--ink);overflow:hidden;position:relative}
.photobox img{max-height:160px;width:100%;object-fit:cover}

/* sheet */
.scrim{position:absolute;inset:0;background:rgba(10,16,12,.45);z-index:30}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:31;background:var(--bg);border-radius:22px 22px 0 0;max-height:88%;overflow-y:auto;padding-block:10px 22px;box-shadow:0 -6px 24px rgba(0,0,0,.2)}
.grab{width:40px;height:5px;border-radius:999px;background:var(--line-strong);margin:0 auto 10px}
.toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:40;max-width:calc(100% - 32px);text-align:center}
.empty{padding:20px;border-radius:18px;border:1.5px dashed var(--line-strong);text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
@media (prefers-reduced-motion: reduce){.sweep,.pin::after{animation:none!important}*{transition:none!important}}
</style>

<div id="app">
  <main id="main" tabindex="-1"></main>
  <div id="action"></div>
  <nav class="tabs pad" aria-label="Main" id="tabs"></nav>
  <div id="sheetroot"></div>
  <div class="toast" id="toast" role="status" hidden></div>
</div>

<script>
(function(){
'use strict';
/* ---------------- utilities ---------------- */

const P = {
  pin:'<path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',

  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
  bus:'<rect x="4" y="3" width="16" height="15" rx="3"/><path d="M4 11h16M8 21v-3M16 21v-3"/>',

  tram:'<rect x="6" y="6" width="12" height="12" rx="3"/><path d="M9 2h6M12 2v4M6 12h12M9 21l1.5-3M15 21l-1.5-3"/>',

const D2R = Math.PI/180, R2D = 180/Math.PI;
function distKm(a, b, c, d){ const dl = (c-a)*D2R, dn = (d-b)*D2R; const x = Math.sin(dl/2)**2 + Math.cos(a*D2R)*Math.cos(c*D2R)*Math.sin(dn/2)**2; return 12742*Math.asin(Math.min(1, Math.sqrt(x))); }

const COMPASS = ['north','north-east','east','south-east','south','south-west','west','north-west'];
const compass = b => COMPASS[Math.round(b/45) % 8];
function sunInfo(ms, lat, lon){
  const JD = ms/86400000 + 2440587.5;
  const n = Math.round(JD - 2451545 + lon/360), Js = n - lon/360;
  const M = ((357.5291 + 0.98560028*Js) % 360 + 360) % 360, Mr = M*D2R;
  const C = 1.9148*Math.sin(Mr) + 0.02*Math.sin(2*Mr) + 0.0003*Math.sin(3*Mr);
  const L = ((M + C + 180 + 102.9372) % 360) * D2R;
  const Jt = 2451545 + Js + 0.0053*Math.sin(Mr) - 0.0069*Math.sin(2*L);
  const sd = Math.sin(L)*Math.sin(23.4397*D2R), cd = Math.cos(Math.asin(sd)), phi = lat*D2R;
  const w = h => { const c = (Math.sin(h*D2R) - Math.sin(phi)*sd)/(Math.cos(phi)*cd); return c < -1 ? 'day' : c > 1 ? 'night' : Math.acos(c)*R2D; };
  const toMs = J => (J - 2440587.5)*86400000;
  const w0 = w(-0.833), w6 = w(-6), out = { noon: toMs(Jt) };
  if (typeof w0 === 'number'){ out.rise = toMs(Jt - w0/360); out.set = toMs(Jt + w0/360); } else out.polar = w0;
  if (typeof w6 === 'number') out.dusk = toMs(Jt + w6/360);
  out.azSet = 360 - Math.acos(Math.max(-1, Math.min(1, sd/Math.cos(phi))))*R2D;
  return out;
}

async function fetchJSON(url, opt = {}, ms = 15000){
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), ms);
  const outer = opt.signal; if (outer) outer.addEventListener('abort', () => ctl.abort());
  try { const r = await fetch(url, { ...opt, signal: ctl.signal }); if (!r.ok) throw new Error('HTTP ' + r.status); return await r.json(); }
  finally { clearTimeout(t); }
}
const OVERPASS = ['https://overpass-api.de/api/interpreter', 'https://overpass.kumi.systems/api/interpreter'];
async function overpass(q, signal){
  let err;
  for (const u of OVERPASS){
    try { return await fetchJSON(u, { method: 'POST', body: 'data=' + encodeURIComponent(q), headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, signal }, 30000); }
    catch(e){ if (signal && signal.aborted) throw e; err = e; }
  }
  throw err;
}
function classify(t){
  if (t.tourism === 'viewpoint') return 'view';
  if (t.natural === 'peak') return 'peak';
  if (t.waterway === 'waterfall') return 'falls';
  if (t.natural === 'beach') return 'beach';
  if (t.natural === 'water') return 'water';
  if (t.leisure === 'nature_reserve' || t.boundary === 'national_park' || t.natural === 'wood') return 'nature';
  if (t.leisure === 'garden') return 'garden';
  if (t.tourism === 'picnic_site') return 'picnic';
  return 'park';
}
function stopMode(t){
  if (t.amenity === 'ferry_terminal') return 'ferry';
  if (t.railway === 'tram_stop' || t.station === 'light_rail') return 'tram';
  if (t.station === 'subway' || t.subway === 'yes') return 'metro';
  if (t.railway === 'station' || t.railway === 'halt') return 'train';
  return 'bus';
}
const walkMin = km => Math.max(1, Math.round(km*1.25/4.8*60));

async function osmFind(o, signal){
  const R = 14000, A = `(around:${R},${o.lat},${o.lon})`;
  const q = `[out:json][timeout:25];(
nwr["tourism"="viewpoint"]["name"]${A};
nwr["leisure"="park"]["name"]["wikidata"]${A};
nwr["leisure"="nature_reserve"]["name"]${A};
nwr["boundary"="national_park"]["name"]${A};
nwr["leisure"="garden"]["name"]["wikidata"]${A};
nwr["natural"~"^(peak|beach|wood|water)$"]["name"]["wikidata"]${A};
nwr["waterway"="waterfall"]["name"]${A};
nwr["tourism"="picnic_site"]["name"]${A};
);out center tags 300;`;
  const data = await overpass(q, signal);
  const base = { view:4, falls:5, peak:4, nature:4, beach:4, park:3, water:3, garden:2, picnic:1 };
  const seen = new Set(), cands = [];
  for (const el of (data.elements || [])){
    const t = el.tags || {}, lat = el.lat != null ? el.lat : el.center && el.center.lat, lon = el.lon != null ? el.lon : el.center && el.center.lon;
    if (lat == null || !t.name) continue;
    const name = t['name:en'] && !/^[\x00-\x7F]*$/.test(t.name) ? t.name + ' · ' + t['name:en'] : t.name;
    const id = name.toLowerCase(); if (seen.has(id)) continue; seen.add(id);
    const kind = classify(t), km = distKm(o.lat, o.lon, lat, lon);
    if (km < 0.25) continue;
    cands.push({ el, t, kind, lat, lon, km, name, score: base[kind] + (t.wikipedia ? 2 : 0) + (t.wikidata ? 1 : 0) - km*0.12 });
  }
  cands.sort((a, b) => b.score - a.score);
  const per = {}, pick = [];
  for (const c of cands){ if ((per[c.kind] = (per[c.kind] || 0) + 1) > 4) continue; pick.push(c); if (pick.length >= 14) break; }
  if (!pick.length) return [];
  const around = (a, b) => `node(around:650,${a},${b})["highway"="bus_stop"];node(around:1600,${a},${b})["railway"~"^(station|halt|tram_stop)$"];node(around:900,${a},${b})["amenity"="ferry_terminal"];`;
  const sq = `[out:json][timeout:25];(${pick.map(c => around(c.lat, c.lon)).join('')}${around(o.lat, o.lon)});out body 3000;`;
  let stops = [];
  try { const sd = await overpass(sq, signal); stops = (sd.elements || []).filter(e => e.lat != null).map(e => ({ id: e.id, lat: e.lat, lon: e.lon, mode: stopMode(e.tags || {}), name: (e.tags && (e.tags.name || (e.tags.ref ? 'Stop ' + e.tags.ref : ''))) || 'Unnamed stop' })); }
  catch(e){ if (signal && signal.aborted) throw e; }
  const near = (lat, lon, maxKm, mode) => stops.map(s => ({ s, km: distKm(lat, lon, s.lat, s.lon) })).filter(x => x.km <= maxKm && (!mode || x.s.mode === mode)).sort((a, b) => (a.km + (a.s.mode === 'bus' ? 0.25 : 0)) - (b.km + (b.s.mode === 'bus' ? 0.25 : 0)));
  return pick.map(c => {
    const t = c.t, k = KIND[c.kind];
    const s = { key: 'osm-' + c.el.type[0] + c.el.id, name: c.name, kind: c.kind, lat: c.lat, lon: c.lon, src: 'osm',
      km: c.km, brg: bearing(o.lat, o.lon, c.lat, c.lon), diff: k.diff, diffNote: 'Estimated from map data', visit: k.visit,
      blurb: t.description ? String(t.description).slice(0, 160) : k.blurb, path: '', tips: [], dirs: [], facts: [] };
    if (c.kind === 'peak' && t.ele) s.facts.push('Summit ' + Math.round(+t.ele) + ' m');
    if (t.wheelchair) s.facts.push('Wheelchair access: ' + t.wheelchair);
    if (t.opening_hours) s.facts.push('Opening hours: ' + t.opening_hours);
    if (t.fee) s.facts.push('Fee: ' + t.fee);
    if (t.wheelchair === 'yes') { s.diff = 'easy'; s.diffNote = 'Mapped as wheelchair accessible'; }
    if (c.km < 1.3){ s.walkOnly = true; s.total = walkMin(c.km); s.finalMin = s.total; s.finalKm = +(c.km*1.25).toFixed(1); return s; }
    const st = near(c.lat, c.lon, 1.6)[0];
    if (!st){ s.noTransit = true; s.total = null; return s; }
    const fk = st.km*1.25;
    const oSame = near(o.lat, o.lon, 2, st.s.mode)[0], oAny = near(o.lat, o.lon, 2)[0];
    const os = oSame && walkMin(oSame.km) <= 20 ? oSame : oAny;
    s.stop = { id: st.s.id, name: st.s.name, mode: st.s.mode, lat: st.s.lat, lon: st.s.lon, lines: [] };
    s.oStop = os ? { name: os.s.name, mode: os.s.mode } : null;
    s.walkTo = os ? walkMin(os.km) : 8;
    const m = MODE[st.s.mode];
    const rideKm = distKm(os ? os.s.lat : o.lat, os ? os.s.lon : o.lon, st.s.lat, st.s.lon)*1.35;
    s.changes = os && os.s.mode !== st.s.mode ? 1 : 0;
    s.ride = Math.max(3, Math.round(rideKm/m.speed*60) + 2) + (os ? MODE[os.s.mode].wait : m.wait) + (s.changes ? 8 : 0);
    s.finalMin = walkMin(st.km); s.finalKm = +fk.toFixed(1);
    s.total = s.walkTo + s.ride + s.finalMin;
    s.dirs = [`From ${st.s.name}, head ${compass(bearing(st.s.lat, st.s.lon, c.lat, c.lon))} towards ${c.name}.`,
              `It's about ${Math.round(fk*1000/50)*50} m on foot, roughly ${s.finalMin} min.`,
              `Look for the entrance and signs. The map point marks the middle of the place.`];
    return s;
  });
}

function setStatus(st, msg){ S.status = st; S.msg = msg || ''; if (route().v !== 'explore') location.hash = 'explore'; else render(true); }
function done(o, spots, src){
  S.ctl = null;
  spots.sort((a, b) => (a.total == null) - (b.total == null) || (a.total || 0) - (b.total || 0));
  Object.assign(S, { origin: o, spots, src, foundAt: Date.now(), status: 'ready', msg: '' });
  setTZ(o);
  const inRange = spots.filter(s => s.total != null && s.total <= S.f.time);
  S.sel = (inRange[0] || spots[0]).key;

}
async function getSample(){ if (!window.claude || typeof window.claude.use !== 'function') return null; try { return await window.claude.use('sample'); } catch(e){ return null; } }
function aiErr(e){
  const c = e && e.code;
  if (c === 'not_granted') return "Claude wasn't allowed to help in this view. Allow it when asked, or try the demo city.";
  if (c === 'rate_limited') return 'Lots of searches right now. Try again in a minute.';
  if (c === 'invalid_json' || c === 'empty') return "Couldn't read a list of places for that search. Try a nearby town or add the country.";
  return "Couldn't reach Claude just now. Check your connection and try again.";
}
async function aiFind(text, o){
  const sample = await getSample();

  S.ctl = new AbortController();
  setStatus('loading', `Asking Claude about outdoor spots near ${text}. This can take up to a minute.`);
  try {
    const data = await sample.json(aiPrompt(text, o), { signal: S.ctl.signal, modelTier: 'default' });
    const r = fromAI(data, o, text);
    if (!r.spots.length) throw { code: 'empty' };

  } catch(e){
    S.ctl = null;
    if (e && e.code === 'cancelled'){ setStatus(S.spots.length ? 'ready' : 'idle'); return; }

}

async function searchPlace(text){

      const o = { lat: p.coords.latitude, lon: p.coords.longitude, name: 'Your location', source: 'gps' };
      try {
        const g = await fetchJSON(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=15&accept-language=en&lat=${o.lat}&lon=${o.lon}`, {}, 8000);
        const a = g.address || {};

        o.area = a.city || a.town || a.county || ''; o.cc = (a.country_code || '').toUpperCase();

function phase(){

  const now = Date.now(), su = sunInfo(now, S.origin.lat, S.origin.lon);
  if (su.polar === 'night') return 'night'; if (su.polar === 'day') return 'day';
  if (now > (su.dusk || su.set) + 15*60e3 || now < su.rise - 30*60e3) return 'night';
  if (now > su.set - 75*60e3 || now < su.rise + 40*60e3) return 'golden';
  return 'day';
}
const PAL = {

  golden: { sky:['#F5C98E','#F8E6C6'], sun:'#F08A4B', hills:['#C8B58C','#8A8F5E','#3E5A36'], water:'#E5B48A', sand:'#E7C995', trunk:'#4F3A2A' },
  night:  { sky:['#1C2944','#33466A'], sun:'#E9EEF5', hills:['#3A4F60','#2A3B48','#18262E'], water:'#2E4A63', sand:'#59606A', trunk:'#1B2328' }
};

  let g = `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${p.sky[0]}"/><stop offset="1" stop-color="${p.sky[1]}"/></linearGradient></defs><rect width="100" height="70" fill="url(#${id})"/>`;
  const sx = ph === 'golden' ? 70 + r()*15 : 20 + r()*60, sy = ph === 'golden' ? 34 : 12 + r()*8;
  g += `<circle cx="${sx}" cy="${sy}" r="${ph === 'night' ? 4.5 : 7}" fill="${p.sun}"/>`;
  if (ph === 'night') for (let i = 0; i < 9; i++) g += `<circle cx="${r()*100}" cy="${r()*30}" r="${0.3 + r()*0.4}" fill="#fff" opacity=".8"/>`;

  else g += hill(50 + r()*4, 8, p.hills[1]);

    if (k === 'falls') g += `<path d="M38 26h24v44H38z" fill="${p.hills[2]}"/><path d="M46 26h8v38h-8z" fill="#EAF4F8" opacity=".9"/>`;

function radarSvg(max, su){

  for (let m = step; m <= max; m += step){ const r = m/max*R; g += `<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--radar-ring)" stroke-width="${m === max ? 2 : 1.2}"/><text x="${c + r*0.71 + 3}" y="${c - r*0.71 - 3}" font-size="11" font-weight="700" fill="var(--radar-text)" font-family="Figtree,sans-serif">${m}′</text>`; }
  g += `<text x="${c}" y="14" text-anchor="middle" font-size="12" font-weight="800" fill="var(--radar-text)" font-family="Figtree,sans-serif">N</text>`;
  if (su && su.azSet && !su.polar){ const a = su.azSet*D2R, x = c + (R + 2)*Math.sin(a), y = c - (R + 2)*Math.cos(a); g += `<g><circle cx="${x}" cy="${y}" r="9" fill="#F2A65A"/><path d="M${x - 5} ${y + 1}h10" stroke="#fff" stroke-width="1.6"/><text x="${x + (Math.sin(a) < 0 ? 14 : -14)}" y="${y + 4}" text-anchor="${Math.sin(a) < 0 ? 'start' : 'end'}" font-size="10.5" font-weight="700" fill="var(--radar-text)" font-family="Figtree,sans-serif">sunset</text></g>`; }

}

/* ---------------- render ---------------- */
const main = document.getElementById('main'), action = document.getElementById('action'), tabsEl = document.getElementById('tabs'), sheetRoot = document.getElementById('sheetroot');
function route(){
  const h = (location.hash || '#explore').slice(1), i = h.indexOf('-');
  const v = i < 0 ? h : h.slice(0, i), id = i < 0 ? '' : h.slice(i + 1);
  return { v: ['explore','spot','trip','update','saved','trips','updates'].includes(v) ? v : 'explore', id };
}
let pending = false;
function soft(){
  const a = document.activeElement;
  if (a && (a.tagName === 'TEXTAREA' || a.tagName === 'INPUT')){ pending = true; return; }
  const r = route().v; if (r === 'spot' || r === 'updates' || r === 'explore' || r === 'update' || r === 'trip') render(true);
}
function render(keep){
  pending = false;
  const r = route(), y = main.scrollTop;
  let out;
  if (r.v === 'spot' || r.v === 'trip' || r.v === 'update'){
    const s = getSpot(r.id);
    if (!s){ if (location.hash !== '#explore') location.replace('#explore'); r.v = 'explore'; out = exploreView(); }
    else out = r.v === 'spot' ? spotView(s) : r.v === 'trip' ? tripView(s) : updateFormView(s);
  } else out = r.v === 'saved' ? savedView() : r.v === 'trips' ? tripsView() : r.v === 'updates' ? updatesView() : exploreView();
  main.innerHTML = out.body;
  action.innerHTML = out.action || '';
  const tv = r.v === 'spot' ? 'explore' : r.v === 'trip' ? 'trips' : r.v === 'update' ? 'updates' : r.v;
  const tab = (k, href, icon, label) => `<a class="tab" href="${href}" ${tv === k ? 'aria-current="page"' : ''}>${ic(icon, 23, tv === k ? 2.5 : 2)}${label}</a>`;
  tabsEl.innerHTML = tab('explore','#explore','compass','Explore') + tab('saved','#saved','heart','Saved') + tab('trips','#trips','bus','Trips') + tab('updates','#updates','chat','Updates');
  const hadSheet = !!sheetRoot.firstChild;
  sheetRoot.innerHTML = sheet();
  if (S.sheet && !hadSheet){ const f = sheetRoot.querySelector('#wq') || sheetRoot.querySelector('button'); if (f) setTimeout(() => f.focus(), 30); }
  main.scrollTop = keep ? y : 0;
}
let toastT;
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2800); }

async function loadLines(s){
  const id = s.stop.id; S.lines[id] = 'loading';
  try {
    const d = await overpass(`[out:json][timeout:15];node(${id});rel(bn)["type"="route"]["route"~"^(bus|train|tram|subway|light_rail|ferry|trolleybus|monorail)$"];out tags;`);
    const set = new Set(); (d.elements || []).forEach(e => { const t = e.tags || {}; const l = t.ref || t.name; if (l) set.add(l.length > 18 ? l.slice(0, 18) + '…' : l); });
    S.lines[id] = [...set].slice(0, 12);
    if (S.lines[id].length && !s.stop.lines.length) s.stop.lines = S.lines[id].slice(0, 2);
  } catch(e){ S.lines[id] = []; }
  if (route().v === 'spot') soft();
}
async function askMore(s){
  const sample = await getSample();
  if (!sample){ S.more[s.key] = { err: "Claude isn't available in this view." }; render(true); return; }
  S.more[s.key] = null; render(true);
  try {
    const d = await sample.json(`Give practical, friendly info about the outdoor place "${s.name}" (${KIND[s.kind].label}) at coordinates ${s.lat}, ${s.lon}, near ${S.origin ? S.origin.name : 'the city'}. Reply with JSON only: {"about": string (max 300 chars), "tips": [up to 3 short practical tips for a casual visitor arriving by public transport]}. If you don't know this exact place, say so in "about" and keep the tips general.`, { modelTier: 'quick' });
    S.more[s.key] = { about: String((d && d.about) || '').slice(0, 400), tips: (Array.isArray(d && d.tips) ? d.tips : []).slice(0, 3).map(t => String(t).slice(0, 160)) };
  } catch(e){ S.more[s.key] = { err: aiErr(e) }; }
  if (route().v === 'spot') render(true);
}

/* ---------------- events ---------------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a, v = b.dataset.v;
  switch (a){
    case 'where': S.sheet = 'where'; S.whereMsg = ''; break;
    case 'filters': S.sheet = 'filters'; break;
    case 'close': S.sheet = null; break;
    case 'locate': useLocation(); return;
    case 'place': searchPlace(v); return;
    case 'demo': { S.sheet = null; const d = demoData(); done(d.origin, d.spots, 'demo'); toast('Demo city: places are made up'); return; }
    case 'cancel': if (S.ctl) S.ctl.abort(); S.ctl = null; S.status = S.spots.length ? 'ready' : 'idle'; break;
    case 'refresh': { const o = S.origin; if (!o) break; if (S.src === 'demo'){ toast('Demo city refreshed'); break; } if (o.source === 'ai' || S.src === 'ai') aiFind(o.name, o.noCoords ? null : o); else findAround(o, o.name); return; }
    case 'time': S.f.time = +v; saveF(); break;
    case 'act': S.f.act = v; saveF(); break;
    case 'diff': S.f.diff[v] = !S.f.diff[v]; saveF(); break;
    case 'reset': S.f = { time: 45, act: 'all', diff: { easy: true, moderate: true, hilly: true } }; saveF(); break;
    case 'any': S.f = { time: 999, act: 'all', diff: { easy: true, moderate: true, hilly: true } }; saveF(); break;
    case 'sel': S.sel = v; break;
    case 'surprise': {
      const now = Date.now(), su = S.origin && !S.origin.noCoords ? sunInfo(now, S.origin.lat, S.origin.lon) : null;
      let pool = filtered().filter(s => s.total != null && s.key !== S.sel);
      if (su && su.set && now < su.set) { const ok = pool.filter(s => now + (s.total*2 + 45)*60e3 < su.set); if (ok.length) pool = ok; }
      if (!pool.length){ toast('Widen your filters for more surprises'); return; }
      const s = pool[Math.floor(Math.random()*pool.length)]; S.sel = s.key; render(true); toast(`How about ${s.name}? About ${s.total} min away`); return;
    }
    case 'save': {
      const s = getSpot(v); if (!s) return;
      if (S.saved[v]) delete S.saved[v]; else S.saved[v] = { spot: s, at: Date.now() };
      LS.set('ts-saved', S.saved); toast(S.saved[v] ? 'Saved' : 'Removed from saved'); break;
    }
    case 'vote': {
      const [id, val] = v.split('|'); const cur = Store.myVotes[id], next = cur === val ? null : val;
      if (next) Store.myVotes[id] = next; else delete Store.myVotes[id]; LS.set('ts-myvotes', Store.myVotes);
      if (Store.db){ const ref = Store.db.collection('votes').doc(id + '_' + VID); (next ? ref.set({ u: id, v: next, at: Date.now() }) : ref.delete()).catch(() => toast('Saved on this device only')); }
      break;
    }
    case 'more': askMore(getSpot(v)); return;
    case 'leave': S.trip.leave = v; break;
    case 'visit': S.trip.visit = +v; break;
    case 'ret': S.trip.ret = !S.trip.ret; break;
    case 'savetrip': {
      const s = getSpot(v); if (!s) return; const p = plan(s);
      S.trips = S.trips.filter(t => t.key !== v);
      S.trips.push({ key: v, spot: s, savedAt: Date.now(), label: `Leave ${fmt(p.leave)} · arrive ${fmt(p.arrive)}${S.trip.ret ? ' · home ' + fmt(p.home) : ''}` });
      LS.set('ts-trips', S.trips); toast('Trip saved to Trips'); return;
    }
    case 'rmtrip': S.trips = S.trips.filter(t => t.key !== v); LS.set('ts-trips', S.trips); break;
    case 'cat': S.form.cat = S.form.cat === v ? null : v; break;
    case 'fwhere': S.form.where = v; break;
    case 'when': S.form.when = v; break;
    case 'unpost': {
      const u = S.posted; if (!u) break;
      if (u.shared && Store.db) Store.db.doc('updates/' + u.id).delete().catch(() => {});
      Store.local = Store.local.filter(x => x.id !== u.id); LS.set('ts-updates', Store.local);
      delete Store.photos[u.id]; LS.set('ts-photos', Store.photos);
      S.posted = null; toast('Update removed'); break;
    }
    default: return;
  }
  render(true);
});
document.addEventListener('submit', async e => {
  e.preventDefault();
  if (e.target.id === 'searchForm'){ const q = document.getElementById('q'); searchPlace(q.value); return; }
  if (e.target.id === 'whereForm'){ const q = document.getElementById('wq'); searchPlace(q.value); return; }
  if (e.target.id === 'uform'){
    const F = S.form, s = getSpot(route().id); if (!F.cat || !s) return;
    const off = { now: 0, hour: 60, today: 180, yday: 1440 }[F.when] || 0;
    const data = { spot: s.key, spotName: s.name, cat: F.cat, text: F.note.trim().slice(0, 200), where: F.where, seenAt: Date.now() - off*60e3, createdAt: Date.now() };
    let u = null;
    if (Store.db){ try { const ref = await Store.db.collection('updates').add(data); u = { id: ref.id, ...data, shared: true }; Store.mine[ref.id] = 1; LS.set('ts-mine', Store.mine); } catch(err){ toast('Saved on this device only'); } }
    if (!u){ u = { id: 'l' + Date.now().toString(36), ...data, shared: false }; Store.local.unshift(u); LS.set('ts-updates', Store.local.slice(0, 200)); }
    if (F.photo){ Store.photos[u.id] = F.photo; LS.set('ts-photos', Store.photos); }
    S.posted = u; S.form = { cat: null, where: 'On the path', when: 'now', note: '', photo: null };
    render(false);
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'note'){ S.form.note = e.target.value.slice(0, 200); const c = document.getElementById('count'); if (c) c.textContent = S.form.note.length + '/200'; }
});
document.addEventListener('focusout', () => { setTimeout(() => { if (pending) soft(); }, 50); });
document.addEventListener('change', e => {
  if (e.target.id === 'photo' && e.target.files && e.target.files[0]){
    const file = e.target.files[0], img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, 640/Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); S.form.photo = c.toDataURL('image/jpeg', 0.72); URL.revokeObjectURL(url); render(true); };
    img.onerror = () => { URL.revokeObjectURL(url); toast("That photo couldn't be read"); };
    img.src = url;
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.sheet){ S.sheet = null; render(true); } });
window.addEventListener('hashchange', () => {
  const r = route();
  if (r.v !== 'update') S.posted = null;
  if (r.v === 'update' && S.posted && S.posted.spot !== r.id) S.posted = null;
  S.sheet = null; render(false);
  if (r.v === 'spot' && location.hash === '#ups'){ const el = document.getElementById('ups'); if (el) el.scrollIntoView(); }
});
document.addEventListener('click', e => { const a = e.target.closest('a[href="#ups"]'); if (a){ e.preventDefault(); const el = document.getElementById('ups'); if (el) el.scrollIntoView({ behavior: 'smooth' }); } });

render(false);
initDb();
setInterval(() => { if (route().v === 'explore' && !S.sheet && !(document.activeElement && document.activeElement.tagName === 'INPUT')) render(true); }, 60000);
})();
</script>
